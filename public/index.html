<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pre-Construction Project Timeline</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- User info with current date/time and username -->
        <div class="user-info">
            User: <span id="current-user">Jmk125</span> | Date: <span id="current-datetime">2025-04-22 20:54:05</span>
        </div>

        <h1>Pre-Construction Project Timeline</h1>
        
        <div class="controls">
            <div class="main-controls">
                <button id="add-project">Add Project</button>
                <button id="export-data">Export Projects</button>
                <button id="load-data">Load Projects</button>
                <button id="publish-data" class="publish-btn">Publish</button>
                <input type="file" id="file-input" style="display: none;">
            </div>
            
            <div class="zoom-controls">
                <button id="zoom-out">−</button>
                <span id="zoom-level">100%</span>
                <button id="zoom-in">+</button>
                <button id="zoom-fit">Fit All</button>
            </div>
        </div>

        <div class="timeline-container">
            <!-- Header with project names and timeline -->
            <div class="timeline-header">
                <div class="project-name-header">Project Name</div>
                <div class="timeline-dates-wrapper">
                    <div class="timeline-dates" id="timeline-dates"></div>
                </div>
            </div>
            
            <!-- Projects container -->
            <div class="project-list" id="projects-container"></div>
        </div>
        
        <!-- Legend (single instance) -->
        <div class="legend" id="legend-container"></div>
        
        <!-- Current date display with input option -->
        <div class="current-date-display">
            Current Date: <input type="date" id="current-date-input" value="2025-04-19">
            <button id="update-today">Update Today</button>
            <label for="past-window-months">Past Months:</label>
            <input type="number" id="past-window-months" min="0" step="1" value="6">
            <label for="future-buffer-months">Future Buffer (Months):</label>
            <input type="number" id="future-buffer-months" min="1" step="1" value="4">
            <button id="apply-time-window">Apply Window</button>
        </div>
        
        <!-- Tooltip for showing dates -->
        <div id="tooltip" class="tooltip"></div>
        
        <!-- Project form modal -->
        <div id="project-modal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2 id="modal-title">Add Project</h2>
                <form id="project-form">
                    <div class="form-content">
                        <div class="form-group">
                            <label for="project-name">Project Name:</label>
                            <input type="text" id="project-name" required>
                        </div>
                        
                        <div class="form-group checkbox-group">
                            <label for="project-potential">Potential Project:</label>
                            <input type="checkbox" id="project-potential">
                            <span class="checkbox-hint">(Marks project as not confirmed)</span>
                        </div>
                        
                        <h3>Activities</h3>
                        <div class="activity-inputs">
                            <div class="form-group">
                                <label for="sd-start">Schematic Design:</label>
                                <input type="date" id="sd-start" placeholder="Start Date">
                                <input type="date" id="sd-end" placeholder="End Date">
                            </div>
                            <div class="form-group">
                                <label for="dd-start">Design Development:</label>
                                <input type="date" id="dd-start" placeholder="Start Date">
                                <input type="date" id="dd-end" placeholder="End Date">
                            </div>
                            <div class="form-group">
                                <label for="gmp-start">GMP:</label>
                                <input type="date" id="gmp-start" placeholder="Start Date">
                                <input type="date" id="gmp-end" placeholder="End Date">
                            </div>
                            <div class="form-group">
                                <label for="bidding-start">Bidding:</label>
                                <input type="date" id="bidding-start" placeholder="Start Date">
                                <input type="date" id="bidding-end" placeholder="End Date">
                            </div>
                        </div>
                        
                        <!-- Custom Activities Section (NEW) -->
                        <div class="custom-activities-section">
                            <h3 class="custom-activities-header">Custom Activities</h3>
                            <button type="button" class="btn btn-primary" id="add-custom-activity">Add Custom Activity</button>
                            <div id="custom-activities-container" class="custom-activities-container"></div>
                        </div>
                        
                        <div class="form-actions form-footer">
                            <button type="submit" class="save-btn">Save Project</button>
                            <button type="button" id="delete-project" class="delete-btn">Delete Project</button>
                        </div>
                    </div>
                </form>
            </div>
        </div>
    </div>
    
    <!-- Load libraries -->
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.10.7/dayjs.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
